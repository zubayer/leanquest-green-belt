<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lean Green Belt Dojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7f2;--card:#ffffff;--ink:#16221a;--muted:#5d6b61;--line:#dfe7dc;
  --g:#2f8f4e;--g2:#1f6b39;--gl:#e3f3e7;--gold:#e8a317;--goldl:#fdf2d6;--red:#d64545;--redl:#fbe5e5;
  --blue:#2f6fb3;--bluel:#e3eefa;--purple:#6b4fbb;--purplel:#ece7fa;--teal:#16897d;--teall:#dcf3f0;
  --r:16px;--sh:0 1px 2px rgba(20,40,25,.06),0 4px 16px rgba(20,40,25,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1511;--card:#18211b;--ink:#e6eee7;--muted:#9aaa9e;--line:#2a372e;
  --g:#4cbb6c;--g2:#7fd895;--gl:#1d3324;--gold:#f0b73a;--goldl:#3a2e12;--red:#ef6b6b;--redl:#3b1d1d;
  --blue:#6aa7e6;--bluel:#182a3d;--purple:#a28cf0;--purplel:#272040;--teal:#3fc2b3;--teall:#14312d;
  --sh:0 1px 2px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:15.5px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}
nav.side{width:230px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:800;font-size:17px}
.belt{width:34px;height:34px;border-radius:10px;background:var(--g);display:grid;place-items:center;color:#fff;font-size:18px}
nav.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600}
nav.side a:hover{background:var(--gl);color:var(--ink)}
nav.side a.on{background:var(--gl);color:var(--g2)}
nav.side a span.i{width:22px;text-align:center}
.xpbox{margin-top:auto;background:var(--bg);border-radius:12px;padding:12px}
.xpbar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--gold));border-radius:6px;transition:width .5s}
main{flex:1;min-width:0;padding:28px clamp(16px,4vw,44px) 100px;max-width:1100px}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:21px;margin:28px 0 12px;letter-spacing:-.01em}
h3{font-size:16.5px;margin:18px 0 8px}
.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{font-size:28px;font-weight:800;letter-spacing:-.02em}
.lbl{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.btn{border:none;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--g);color:#fff;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--g);color:var(--g2)}
.btn.gold{background:var(--gold);color:#2a1d00}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--gl);color:var(--g2)}
.pill.gold{background:var(--goldl);color:var(--gold)}.pill.red{background:var(--redl);color:var(--red)}
.pill.blue{background:var(--bluel);color:var(--blue)}.pill.purple{background:var(--purplel);color:var(--purple)}
.mod{cursor:pointer;transition:transform .12s,border-color .12s;position:relative}
.mod:hover{transform:translateY(-2px);border-color:var(--g)}
.mod .num{font-size:12px;font-weight:800;color:var(--muted)}
.mod h3{margin:6px 0 6px}
.mod .done{position:absolute;top:14px;right:14px}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--g)}
.layer{border-radius:14px;padding:16px 18px;margin:12px 0;border:1px solid var(--line)}
.layer .lt{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.L1{background:var(--goldl);border-color:transparent}.L1 .lt{color:var(--gold)}
.L2{background:var(--purplel);border-color:transparent}.L2 .lt{color:var(--purple)}
.L3{background:var(--card)}.L3 .lt{color:var(--blue)}
.L4{background:var(--teall);border-color:transparent}.L4 .lt{color:var(--teal)}
.L5{background:var(--redl);border-color:transparent}.L5 .lt{color:var(--red)}
.layer ul{margin:6px 0;padding-left:20px}.layer li{margin:3px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.mono{font-family:'JetBrains Mono',monospace;font-size:14px}
.formula{font-family:'JetBrains Mono',monospace;background:var(--bg);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:14px;border-left:4px solid var(--g)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--ink);font-weight:500;transition:border-color .1s,background .1s}
.opt:hover:not(:disabled){border-color:var(--g)}
.opt.ok{border-color:var(--g);background:var(--gl)}
.opt.bad{border-color:var(--red);background:var(--redl)}
.opt.pick{border-color:var(--blue);background:var(--bluel)}
.opt:disabled{cursor:default}
.opt b{display:inline-block;width:24px;color:var(--muted)}
.expl{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:14.5px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.qtext{font-size:17px;font-weight:600;margin:4px 0 8px}
.flash{perspective:1200px;height:270px;margin:10px 0 16px;cursor:pointer;user-select:none}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;border:1px solid var(--line);box-shadow:var(--sh)}
.flash .f{background:var(--card);font-size:24px;font-weight:800}
.flash .b{background:var(--gl);transform:rotateY(180deg);font-size:16.5px}
.flash .hint{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(40px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.3s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tile{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--card);font-weight:600;text-align:center;min-height:64px;display:flex;align-items:center;justify-content:center;transition:.15s}
.tile:hover:not(.gone){border-color:var(--g)}
.tile.sel{border-color:var(--blue);background:var(--bluel)}
.tile.gone{opacity:.3;border-style:dashed;cursor:default}
.tile.wrong{animation:shake .35s;border-color:var(--red)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mem{aspect-ratio:1.25;font-size:13.5px}
.mem.hidden{background:var(--g);color:transparent;border-color:var(--g)}
.mem.hidden::after{content:'?';color:#fff;font-size:22px;font-weight:800}
.mem.matched{background:var(--gl);border-color:var(--g);color:var(--g2)}
.bigq{font-size:19px;font-weight:700;padding:18px;border-radius:14px;background:var(--bg);margin:8px 0 14px;min-height:90px;display:flex;align-items:center}
.combo{font-weight:800;color:var(--gold)}
.timer{font-family:'JetBrains Mono',monospace;font-weight:700;padding:5px 12px;border-radius:10px;background:var(--bg)}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.dots span{width:26px;height:26px;border-radius:7px;background:var(--bg);border:1px solid var(--line);font-size:11px;display:grid;place-items:center;font-weight:700;cursor:pointer}
.dots span.a{background:var(--bluel);border-color:var(--blue);color:var(--blue)}
.dots span.c{outline:2px solid var(--ink)}
.dots span.ok{background:var(--gl);color:var(--g2);border-color:var(--g)}
.dots span.bad{background:var(--redl);color:var(--red);border-color:var(--red)}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}
.bar .t{width:170px;flex-shrink:0}
.bar .b{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .b i{display:block;height:100%}
.hero{background:linear-gradient(135deg,var(--g) 0%,var(--g2) 100%);color:#fff;border-radius:22px;padding:26px;position:relative;overflow:hidden}
@media (prefers-color-scheme:dark){.hero{background:linear-gradient(135deg,#1f5a33,#163d24)}}
.hero h1{color:#fff}.hero p{opacity:.92;margin:6px 0 16px;max-width:620px}
.hero .btn{background:#fff;color:#1f6b39}
.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.hero .deco{position:absolute;right:-20px;top:-20px;font-size:150px;opacity:.12;transform:rotate(-12deg)}
.road{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.road div{flex:1;min-width:120px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13.5px}
.road b{display:block;font-size:12px;color:var(--g2)}
.sortbins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.bin{min-height:120px;border:2px dashed var(--line);border-radius:14px;padding:10px}
.bin h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.chip{display:inline-block;padding:6px 10px;margin:3px;border-radius:9px;background:var(--bg);font-size:13px;font-weight:600;border:1px solid var(--line)}
.chip.ok{background:var(--gl);border-color:var(--g)}.chip.bad{background:var(--redl);border-color:var(--red)}
input.num{font-family:'JetBrains Mono',monospace;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:160px}
input.num:focus{outline:none;border-color:var(--g)}
.err{color:var(--red);font-size:13px;font-weight:600;margin-top:6px}
select{font-family:inherit;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:600}
.cheat h3{margin-top:0;color:var(--g2)}
.cheat ul{margin:4px 0;padding-left:18px;font-size:14px}.cheat li{margin:2px 0}
.kbd{font-family:'JetBrains Mono',monospace;font-size:12px;padding:2px 6px;border-radius:5px;border:1px solid var(--line);background:var(--bg)}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:60;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
.back{color:var(--muted);text-decoration:none;font-weight:700;font-size:14px;display:inline-block;margin-bottom:12px}
.mnav{display:none}
@media (max-width:820px){
  nav.side{display:none}
  main{padding-bottom:110px}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:40;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
  .mnav a{display:flex;flex-direction:column;align-items:center;font-size:10.5px;font-weight:700;color:var(--muted);text-decoration:none;padding:4px 6px;border-radius:8px}
  .mnav a .i{font-size:19px}
  .mnav a.on{color:var(--g2);background:var(--gl)}
  .bar .t{width:110px}
  .flash{height:300px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
<nav class="side" id="side"></nav>
<main id="main"></main>
</div>
<nav class="mnav" id="mnav"></nav>
<div class="toast" id="toast"></div>

<script>
/* ================= DATA ================= */
const TOPICS={
 found:'Lean foundations',value:'Identify value (VOC, stakeholders)',waste:'8 wastes',s5:'5S & visual management',
 map:'Process mapping',vsm:'Value stream & value analysis',flow:'Takt time & flow',rca:'Root cause, 5 Whys & PDCA',
 pull:'Push, pull & kanban',std:'Standard work, SMED & TPM',perf:'Seek perfection (poka yoke, kaizen, A3, change)'
};
const TOPIC_COLORS={found:'#6b4fbb',value:'#2f6fb3',waste:'#d64545',s5:'#e8a317',map:'#16897d',vsm:'#2f8f4e',flow:'#c2571a',rca:'#8a3fa0',pull:'#2f6fb3',std:'#16897d',perf:'#2f8f4e'};

const MODULES=[
{id:'found',n:1,icon:'🏯',title:'Lean foundations',principle:'Before step 1',time:'12 min',
 summary:'What Lean, Six Sigma and LSS are, the belts, the history, the Shingo model and the 5 Lean principles.',
 intuition:'Lean is about making work flow to the customer with nothing wasted, and doing it with respect for the people who do the work. Lean asks "is this step worth it to the customer?" Six Sigma asks "how much does this step vary?"',
 analogy:'Think of a kitchen. Lean clears clutter, removes extra walking and cooks only what was ordered. Six Sigma makes sure every plate tastes the same each time. Lean Six Sigma does both.',
 formal:`<ul>
 <li><b>Lean</b>: improvement method using tools, techniques and measures to meet customer expectations by <b>reducing waste</b> and minimizing defects, <b>while respecting people</b>.</li>
 <li><b>Six Sigma</b>: rigorous data analytics and statistical tools to improve quality by <b>minimizing process variability</b>.</li>
 <li><b>Lean Six Sigma</b>: combines eliminating defects/waste (Lean) with minimizing variability (Six Sigma).</li>
 <li><b>Belts</b>: Yellow = basic knowledge. <b>Green = project leadership</b> (manages projects, delivers quantitative results). Black = mentors for multiple projects and Green Belts.</li>
 </ul>
 <h3>The 5 Lean principles (the course roadmap)</h3>
 <table><tr><th>#</th><th>Principle</th><th>Meaning</th></tr>
 <tr><td>1</td><td>Identify value</td><td>Define value from the customer's perspective</td></tr>
 <tr><td>2</td><td>Map the value stream</td><td>Identify all actions required to create the product or service</td></tr>
 <tr><td>3</td><td>Create flow</td><td>Eliminate barriers and reduce waste</td></tr>
 <tr><td>4</td><td>Establish pull</td><td>Let the customer pull products as needed</td></tr>
 <tr><td>5</td><td>Seek perfection</td><td>Continuously improve; begin the next transformation</td></tr></table>
 <h3>History timeline</h3>
 <table><tr><th>When</th><th>Who / what</th></tr>
 <tr><td>Ancient Mesopotamia →</td><td>Roots of the scientific method</td></tr>
 <tr><td>1799</td><td>Eli Whitney: interchangeable parts (cotton gin era)</td></tr>
 <tr><td>1911</td><td>Frederick Taylor: scientific management</td></tr>
 <tr><td>~1915</td><td>Frank &amp; Lillian Gilbreth: process charts, motion studies in healthcare</td></tr>
 <tr><td>1922</td><td>Ford &amp; Sorensen: assembly/flow lines, mass production</td></tr>
 <tr><td>1940s–50s</td><td>W. Edwards Deming: Plan-Do-Study-Act cycle, statistical quality control</td></tr>
 <tr><td>Post-war</td><td>Taiichi Ohno &amp; Shigeo Shingo: JIT in the Toyota Production System (TPS)</td></tr>
 <tr><td>1988</td><td>John Krafcik coins "Lean" ("Triumph of the Lean Production System")</td></tr></table>
 <h3>Shingo Model (operational excellence framework, Shingo Institute)</h3>
 <ul><li>Principles: respect every individual, lead with humility, focus on process, embrace scientific thinking, flow &amp; pull value, assure quality at the source, seek perfection, create constancy of purpose.</li>
 <li>Four dimensions: <b>cultural enablers</b>, <b>continuous improvement</b>, <b>enterprise alignment</b>, <b>results</b>.</li></ul>
 <h3>Entrepreneurial mindset (KEEN)</h3>
 <p>The 3 Cs are <b>Curiosity, Connections, Creating value</b>. Skillset + mindset = entrepreneurial mindset.</p>`,
 example:'Quick quiz from the slides. Lean is inspired by the <b>Toyota Production System</b>, created by <b>Toyota</b>. Many Lean terms are <b>Japanese</b> because they come from TPS. Lean was used mainly in <b>manufacturing</b> before spreading to healthcare and services.',
 traps:['Green Belt = <b>project leadership</b>; Black Belt = mentors. Don\'t mix them up.','"Lean" was coined by <b>Krafcik in 1988</b>, not by Ohno.','Deming is linked to <b>PDSA/PDCA and SQC</b>; Taylor to scientific management; Gilbreths to motion studies.','Lean = waste + <b>respect for people</b>; Six Sigma = <b>variation</b>.']},

{id:'value',n:2,icon:'🎯',title:'Identify value: VOC & stakeholders',principle:'Step 1 · Identify value',time:'15 min',
 summary:'Who the customer is, how to capture VOC, VA vs NVA vs NNVA, and stakeholder analysis with the power-interest grid.',
 intuition:'Only the customer decides what is valuable. If the customer would not pay for a step, that step is waste or, at best, a required evil.',
 analogy:'At a coffee shop you pay for the coffee to be made. You don\'t pay for the barista hunting for the milk or redoing a wrong order. Hand-washing is required by health code, so it stays, but it should be fast.',
 formal:`<ul>
 <li><b>External customers</b>: buy your products or services (end-users, clients). <b>Internal customers</b>: departments or people inside the organization who rely on your work. Key question: <i>who benefits from the process?</i></li>
 <li><b>VOC</b> = collection of customer <b>needs, preferences and feedback</b>. Components: needs (want/expect), preferences (like/dislike), <b>pain points</b> (frustrations).</li>
 <li><b>VOC methods</b>: surveys (quantitative + qualitative), interviews (one-on-one, in depth), focus groups (collective insights), feedback forms, observation (watch real-time use), complaints/compliments.</li>
 </ul>
 <h3>Value-added vs non-value-added</h3>
 <table><tr><th>Type</th><th>Test</th><th>Action</th></tr>
 <tr><td><b>Value-added (VA)</b></td><td>Customer is willing to pay; it <b>transforms</b> the product; it is <b>done right the first time</b></td><td>Keep and optimize</td></tr>
 <tr><td><b>Unnecessary NVA</b> (waste)</td><td>Not valued and not essential</td><td><b>Eliminate</b></td></tr>
 <tr><td><b>Necessary NVA</b> (value-enabling)</td><td>Not valued, but required by law, regulation or safety</td><td><b>Minimize</b> its time</td></tr></table>
 <p>Typically <b>more than 50%</b> of the steps, time and cost in a process are waste.</p>
 <h3>Stakeholder analysis</h3>
 <ul><li>Identify and assess people or groups who <b>can impact or are impacted</b> by the project. It aligns goals, gains support, spots resistance early and prioritizes effort.</li>
 <li>Internal (employees, managers, teams) vs external (customers, suppliers, regulators, community).</li>
 <li><b>Primary</b> = directly affected (customers, employees). <b>Secondary</b> = indirectly affected (suppliers, regulators). <b>Key</b> = significant influence on success or failure (senior management, key customers).</li></ul>
 <h3>Power-interest grid</h3>
 <table><tr><th></th><th>Low interest</th><th>High interest</th></tr>
 <tr><td><b>High power</b></td><td>Keep satisfied</td><td><b>Manage closely</b></td></tr>
 <tr><td><b>Low power</b></td><td>Monitor (minimum effort)</td><td>Keep informed</td></tr></table>
 <p><b>Engagement strategies</b>: <b>Inform</b> (newsletters, reports) · <b>Consult</b> (focus groups, workshops) · <b>Collaborate</b> (cross-functional teams) · <b>Monitor</b> (track feedback, adjust).</p>
 <p>Typical expectations: management wants efficiency, cost savings and ROI. Employees want job stability, streamlined processes and less workload. Customers want quality, speed and value. Suppliers want clear communication and consistent demand.</p>`,
 example:`<b>OR case.</b> The surgeon chief and the CFO have high power and high interest, so <b>manage closely</b>. The patients' families have low power and high interest, so <b>keep informed</b>. A regulator with high power and low day-to-day interest is <b>keep satisfied</b>. Classifying OR steps: surgery = VA, the safety time-out = necessary NVA, the patient waiting on a gurney = unnecessary NVA.`,
 traps:['"Who determines value?" <b>The customer</b>, always.','Necessary NVA is <b>minimized</b>, not eliminated (regulations, safety).','Regulators and suppliers = <b>secondary</b> stakeholders in the slides\' examples.','High power + high interest = <b>manage closely</b>.']},

{id:'waste',n:3,icon:'🗑️',title:'The 8 wastes (DOWNTIME)',principle:'Step 2 · Map the value stream',time:'12 min',
 summary:'Muda and the 8 wastes, with examples you can spot in any workplace.',
 intuition:'Waste (muda) is anything the customer would not pay for. Learn to see these 8 and you can find waste anywhere.',
 analogy:'Ohno said he was only looking at the timeline from the customer\'s order to collecting the cash, and shrinking it by removing waste. Picture that timeline as a rope full of knots, where each knot is one of the 8 wastes.',
 formal:`<p><b>Muda</b> (Japanese) = futility, uselessness, wastefulness: non-value-added work the customer would not pay for.</p>
 <table><tr><th>Waste</th><th>Definition</th><th>Examples</th></tr>
 <tr><td><b>D</b>efect</td><td>Errors needing extra time, resources or money to fix</td><td>Wrong test ordered, incorrect form, unclear instructions</td></tr>
 <tr><td><b>O</b>verproduction</td><td>More than needed, or <b>sooner</b> than needed</td><td>Producing before orders, duplicated effort, overstaffing. <b>Greatest waste (Toyota)</b></td></tr>
 <tr><td><b>W</b>aiting</td><td>Idle time when material, information or people aren't ready</td><td>Waiting for approval, supplies, a machine cycle, the doctor</td></tr>
 <tr><td><b>N</b>eglected talent</td><td>Losing ideas or skills by not engaging employees. <b>Added later</b>, not one of the original 7</td><td>Front line not included, ideas not followed up, micro-managing</td></tr>
 <tr><td><b>T</b>ransportation</td><td>Unnecessary movement of <b>materials or objects</b></td><td>Moving inventory several times, centralized storage, moving papers</td></tr>
 <tr><td><b>I</b>nventory</td><td>More materials or supplies on hand than needed right now</td><td>Excess raw material, WIP, extra subcomponents</td></tr>
 <tr><td><b>M</b>otion</td><td>Wasted movement of <b>people</b></td><td>Searching for supplies, poor layout, walking between stations</td></tr>
 <tr><td><b>E</b>xcess processing</td><td>Extra steps not valued by the customer</td><td>Unneeded paperwork, over-inspection, re-entering data</td></tr></table>
 <p>Other mnemonics: <b>TIM WOOD</b>, <b>TIM U WOOD</b>, <b>TRIM WOOD</b>.</p>`,
 example:`Sort these hospital moments. A nurse walks 300 ft to find gloves = <b>Motion</b>. A patient on a gurney outside the OR = <b>Waiting</b>. Trays carried to central sterile and back twice = <b>Transportation</b>. Entering the same vitals into 3 systems = <b>Excess processing</b>. 40 extra suture kits in the closet = <b>Inventory</b>. A wrong-site consent form = <b>Defect</b>.`,
 traps:['<b>Transportation = things</b> move; <b>Motion = people</b> move. This is the #1 trap.','<b>Overproduction</b> is the greatest waste because it causes the others (inventory, transport, waiting).','Overproduction includes producing <b>too early</b>, not only too much.','Neglected talent was <b>added later</b>; the original TPS list had 7.']},

{id:'s5',n:4,icon:'🧹',title:'5S & visual management',principle:'Step 2 · Map the value stream',time:'12 min',
 summary:'Sort, Set in order, Shine, Standardize, Sustain with Japanese names, red tags, storage rules, and visual management.',
 intuition:'"A place for everything and everything in its place." 5S makes problems visible because an abnormal thing stands out in an organized space.',
 analogy:'Like your phone home screen. Delete unused apps (Sort), put daily apps in the dock (Set in order), clear notifications (Shine), keep one folder layout (Standardize), and review it monthly (Sustain).',
 formal:`<table><tr><th>#</th><th>English</th><th>Japanese</th><th>What you do</th></tr>
 <tr><td>1</td><td><b>Sort</b></td><td>Seiri</td><td>Decide what to keep and remove; get rid of clutter. <b>Red tag</b> items that are neither kept nor thrown away (recycle, storage, donate, repair, other department). Verify before throwing away.</td></tr>
 <tr><td>2</td><td><b>Set in order</b></td><td>Seiton</td><td>Best location, label it, set inventory limits, visual controls, nothing on the floor. <b>You</b> find anything in ≤30 s; <b>anyone</b> finds anything in ≤60 s.</td></tr>
 <tr><td>3</td><td><b>Shine</b></td><td>Seiso</td><td>Clean everything top to bottom; establish safety measures</td></tr>
 <tr><td>4</td><td><b>Standardize</b></td><td>Seiketsu</td><td>Rules for maintaining the space; <b>designate an owner</b>; keep the first 3S as habits; schedules and checklists</td></tr>
 <tr><td>5</td><td><b>Sustain</b></td><td>Shitsuke</td><td>Spread 5S and build the culture: leadership involvement, <b>gemba walks</b>, reward and recognize, audits, display results</td></tr></table>
 <h3>Storage by frequency of use (Set in order)</h3>
 <table><tr><th>Used</th><th>Store</th></tr><tr><td>Hourly</td><td>Within arm's reach</td></tr><tr><td>Every shift</td><td>Within a short walk</td></tr><tr><td>Daily</td><td>Further away</td></tr><tr><td>Monthly</td><td>Department storage</td></tr><tr><td>Annually</td><td>Central or off-site storage</td></tr></table>
 <p><b>Why 5S?</b> Makes problems visible, eliminates waste, simplifies work, raises productivity, cuts expenses, improves safety, morale and customer perception.</p>
 <h3>Visual management</h3>
 <p>Visual cues and controls that <b>make waste obvious, provide information and standardize tasks</b>, giving status at a glance.</p>
 <table><tr><th>Question</th><th>Visual aids</th></tr>
 <tr><td>Where</td><td>Labeling, color coding, outlining, directional markers, maps</td></tr>
 <tr><td>How</td><td>Standardized worksheets, technical guides, job aids, flowcharts</td></tr>
 <tr><td>When</td><td>Checklists, flowcharts, schedules</td></tr>
 <tr><td>What</td><td>Visual displays, storyboards, safety guides, A3, performance indicators</td></tr>
 <tr><td>Who</td><td>Assignment charts, suggestion boards</td></tr>
 <tr><td>How much</td><td>Metrics, graphs, scorecards, kanban</td></tr></table>`,
 example:`<b>5S numbers game.</b> Round 1: numbers 1–49 are scattered, and you find few in 30 s. Sort removes the numbers above 49. Set in order puts them in quadrants, and you find many more. Standardize keeps the pattern. Same person, same shift, more output, because the <b>system</b> changed.`,
 traps:['Order matters: <b>Sort → Set in order → Shine → Standardize → Sustain</b>.','Red tags belong to <b>Sort</b>. Labels and shadow boards belong to <b>Set in order</b>. Owner and checklists belong to <b>Standardize</b>. Audits and gemba walks belong to <b>Sustain</b>.','30 seconds for <b>you</b>, 60 seconds for <b>anyone</b>.','Seiri, Seiton, Seiso, Seiketsu, Shitsuke are in the same order as S1–S5.']},

{id:'map',n:5,icon:'🗺️',title:'Process mapping: flowchart, SIPOC, swim lane, spaghetti',principle:'Step 2 · Map the value stream',time:'15 min',
 summary:'Levels of detail, the 7 mapping steps, and when to use each map.',
 intuition:'You can\'t improve what you can\'t see. A map shows the process as it is really done today, not how we think or wish it is done.',
 analogy:'Like maps at different zoom levels. A satellite view shows the whole value stream (SIPOC, VSM). A city view shows departments (swim lane). Street view shows every turn (flowchart). The spaghetti diagram is the GPS trace of where people actually walked.',
 formal:`<p><b>Process</b> = a set of conditions or causes working together to bring about a product or service. It is <b>recurrent</b>, affects organizational capability, can be accomplished differently, and involves coordination.</p>
 <p><b>Three versions</b>: what you think it is, what it actually is (<b>current state</b>), what you would like it to be (future state). Map the current state first.</p>
 <h3>Levels of detail</h3>
 <table><tr><th>Level</th><th>Altitude</th><th>Maps</th></tr>
 <tr><td>Macro / high</td><td>30,000 ft</td><td><b>VSM, SIPOC</b></td></tr>
 <tr><td>Mini / mid (department)</td><td>10,000 ft</td><td><b>Swim lane</b></td></tr>
 <tr><td>Micro / low (working level)</td><td>Ground ("weeds")</td><td><b>Process flow diagram</b>, value-added flowchart</td></tr></table>
 <h3>7 process-mapping steps</h3>
 <ol><li>Gather your team</li><li>Determine process boundaries/scope</li><li>Determine the steps: <b>go to the gemba</b> and talk to the people who do the work</li><li>Review notes and order steps on a draft (butcher block or flipchart)</li><li>Draw the map (Visio, PowerPoint, Word)</li><li>Confirm at the gemba and get consensus</li><li>Finalize and distribute</li></ol>
 <h3>The maps</h3>
 <table><tr><th>Map</th><th>Shows</th><th>Key facts</th></tr>
 <tr><td><b>Process flow diagram</b></td><td>Process steps with standard symbols</td><td>Most commonly used. Shows decision points, alternate paths and variation. Elements: operations, decisions, delays, storages, handling.</td></tr>
 <tr><td><b>SIPOC</b></td><td>Steps plus upstream and downstream elements</td><td>Suppliers (who feeds in), Inputs (what is provided/required), Process, Outputs (what it produces), Customers (who receives/benefits). Plus <b>Requirements</b>.</td></tr>
 <tr><td><b>Swim lane</b></td><td>Sub-processes, departments or responsibilities in rows/columns</td><td>Also called a <b>cross-functional diagram</b>. Shows parallel tasks and <b>hand-offs</b>. Same symbols as a flowchart.</td></tr>
 <tr><td><b>Spaghetti diagram</b></td><td>The physical path of a person and/or object in an area</td><td>Highlights <b>motion and transportation</b> waste. Use different colors per item, measure distance, look for confusing routes, backtracks and crossings. Redraw after re-layout.</td></tr></table>`,
 example:`<b>OR case.</b> A SIPOC lists the suppliers (sterile processing, pharmacy), inputs (trays, drugs, consent), the process (check-in → prep → anesthesia → surgery → recovery → turnover), outputs (completed procedure, clean OR) and customers (patient, recovery unit, next case). A swim lane with lanes for patient, nurse, surgeon, anesthesiologist and OR shows where hand-offs cause delay. A spaghetti diagram traces the nurse walking between the table, the instrument tray and sterilization.`,
 traps:['SIPOC and VSM = <b>macro, 30,000 ft</b>. Swim lane = <b>10,000 ft</b>. Flowchart = <b>ground level</b>.','Spaghetti diagram → <b>motion & transportation</b> waste.','Swim lane = <b>cross-functional</b> diagram; its specialty is <b>hand-offs</b>.','Map the <b>current state</b> (as actually done), confirmed at the gemba.']},

{id:'vsm',n:6,icon:'🌊',title:'Value stream mapping & value analysis',principle:'Step 2 · Map the value stream',time:'15 min',
 summary:'VSM, lead time vs cycle time vs takt time, WIP, days of inventory, % value-added, and current/future/ideal state.',
 intuition:'A VSM is the bird\'s-eye view of material and information flowing from the request to delivery, with the clock running. Most of the clock is waiting, not working.',
 analogy:'Like tracking a package. Cycle time is the time a truck actually drives it. Lead time is the whole order-to-doorstep time. Most of that time the package sits in warehouses (WIP).',
 formal:`<ul><li><b>Value stream</b> = the complete sequence of activities required to produce and deliver the end product or service.</li>
 <li><b>VSM</b> shows the flow of <b>materials and information</b>, and includes takt time, inventory levels, changeover times and staffing. It maps VA, NVA and necessary NVA, at the <b>30,000 ft level</b>, focused on <b>improving the whole process, not optimizing parts</b>.</li>
 <li><b>Current state VSM</b>: the baseline "facts". Is it done well (waste)? Within the time needed (takt)? How long does the whole thing take (lead time)?</li></ul>
 <div class="formula">Lead time (throughput time) = time from order to delivery<br>Cycle time (process time) = time to complete one cycle of a process<br>Takt time = available work time ÷ customer demand<br>Days of inventory = inventory ÷ daily demand<br>% value-added = VA time ÷ lead time</div>
 <ul><li><b>WIP</b> = items in process but not finished. Excess WIP signals delays, waste or imbalance. Ideal WIP aligns with customer demand.</li>
 <li><b>Future state</b> = how things can, should or will work, with waste removed and flow improved. <b>Ideal state</b> = how it would work under perfect circumstances.</li>
 <li><b>Value analysis</b> = assess each step and decide if it adds value from the customer's perspective. It reduces cost, improves productivity and shortens lead time.</li></ul>
 <p>Documentation checklist: hand-offs, steps, push/pull, information flow, performance metrics, crew size, task time per step, volume and WIP at each step, transportation.</p>`,
 example:`<b>Worked example 1 (slide).</b> Inventory is 4,600 L + 2,400 R = 7,000 pcs. Demand is 18,400 pcs/mo ÷ 20 days = 920 pcs/day. Days of inventory = 7,000 ÷ 920 = <b>7.6 days</b>.<br><br>
 <b>Worked example 2 (OR VSM case).</b> Wait times are 5+5+2+5+5+5 = 27 min. Cycle times are 15+30+10+60+10+20 = 145 min. Lead time = 27 + 145 = <b>172 min</b>.`,
 traps:['<b>Lead time</b> = whole order-to-delivery including waits. <b>Cycle time</b> = one pass of a process. <b>Takt</b> = demand pace. Don\'t swap them.','VSM is <b>big picture</b>; it is not a detailed step map.','VSM shows <b>material AND information</b> flow; that is what sets it apart from other maps.']},

{id:'flow',n:7,icon:'⏱️',title:'Takt time & flow',principle:'Step 3 · Create flow',time:'15 min',
 summary:'Calculating takt, demand changes, % value-added, one-piece flow and its limits.',
 intuition:'Takt is the heartbeat of demand: how often a finished unit must come out to match what customers buy. Flow means work moves through without stopping.',
 analogy:'"Takt" is German for a conductor\'s baton. The customer is the conductor setting the tempo, and every process should play at that beat. Not faster (overproduction), not slower (late).',
 formal:`<div class="formula">Takt time = Available work time ÷ Customer demand<br>Production rate = Demand ÷ Available time  (takt is its inverse)</div>
 <ul><li><b>Available work time excludes</b> contractual breaks, lunch, team meetings and clean-up.</li>
 <li>Demand ↓ for an extended period → <b>takt ↑</b> (adjust staffing). Demand ↑ → <b>takt ↓</b>.</li>
 <li>The operators' <b>cycle times should match takt</b>. Produce to takt with the right number of people. Imbalances drive just-in-case inventory.</li>
 <li><b>System cycle time</b> = cycle time of the <b>longest task</b> (the bottleneck).</li></ul>
 <h3>Flow</h3>
 <ul><li>Flow = moving products or services in a steady, continuous stream, with <b>no barriers, delays or impediments</b>. Flow increases when waste is eliminated.</li>
 <li>Benefits: quality, productivity, space, lead time, morale, cost.</li>
 <li><b>One-piece flow</b> (single-piece / continuous flow): work on one unit at a time, with <b>no WIP between steps</b>. It is the Lean ideal.</li>
 <li>One-piece flow is <b>not always possible</b> with: shared processes across value streams, different changeover times, varying cycle times, excessive downtime, high scrap or rework.</li></ul>`,
 example:`<b>A. Shift takt (slide).</b> 480 min − 30 break − 10 wash − 0 clean-up − 5 meeting = 435 min = 26,100 s. 26,100 ÷ 55 pcs = <b>474 s/piece</b>.<br>
 <b>B.</b> 40 h ÷ 100 units = 0.4 h = <b>24 min</b>. Production rate = 100 ÷ 40 = 2.5 units/h.<br>
 <b>C. Clinic.</b> Check-in 3, wait 15, move 2, nurse 5, wait 15, physician 20, wait 15. Lead time = <b>75 min</b>. System cycle time = longest task = <b>20 min</b>. VA = nurse 5 + physician 20 = 25. %VA = 25/75 = <b>33%</b>. Check-in = necessary NVA.<br>
 <b>D. OR case.</b> (10 h × 60 − 60) = 540 min/day per OR × 5 ORs = 2,700 min ÷ 40 surgeries = <b>67.5 min</b>.`,
 traps:['Subtract breaks, lunch, meetings and clean-up <b>before</b> dividing.','Watch units: convert hours → minutes → seconds when the answer asks for seconds.','Demand down = takt <b>up</b>; it\'s an inverse relationship.','Takt ≠ cycle time. Takt comes from the customer; cycle time comes from the process.']},

{id:'rca',n:8,icon:'🔍',title:'Root cause, 5 Whys & PDCA',principle:'Step 3 · Create flow',time:'14 min',
 summary:'Root cause analysis, the 5 Whys (Jefferson Memorial and OR cases), and the 8 PDCA steps.',
 intuition:'Fix the cause, not the symptom. Keep asking "why?" until you reach something you can change that stops the problem coming back.',
 analogy:'A leaky ceiling. Mopping the floor treats the symptom. Asking why five times takes you to the cracked flashing on the roof.',
 formal:`<ul><li><b>Root cause</b> = the fundamental cause of a problem, error or defect. RCA identifies the underlying cause(s) rather than treating symptoms, prevents recurrence and eliminates waste at the source.</li>
 <li><b>5 Whys</b>: an iterative "why?" technique. Why 5? Empirical evidence says it takes <b>about 5 on average</b>; it can be more or fewer, so ask until you reach the true root cause.</li></ul>
 <h3>PDCA (Plan-Do-Check-Act), 8 steps</h3>
 <table><tr><th>Phase</th><th>Steps</th></tr>
 <tr><td><b>Plan</b></td><td>1 Clarify the problem (problem statement) · 2 Break down the problem (current state) · 3 Set a target · 4 Find and analyze the root cause · 5 Develop countermeasures</td></tr>
 <tr><td><b>Do</b></td><td>6 Implement countermeasures (monitor scope, schedule, budget)</td></tr>
 <tr><td><b>Check</b></td><td>7 Evaluate results: planned vs actual. Return to step 5 if needed</td></tr>
 <tr><td><b>Act</b></td><td>8 Standardize success; share lessons learned</td></tr></table>
 <p>PDCA works for all organizations and levels, adapts as learning occurs, and counters the human urge to jump straight to solutions. "You can have PDCA without Lean, but can't have Lean without PDCA" (Mark Graban).</p>
 <p>Lean tools for finding root causes of waste: VSM (bottlenecks, delays, inventory), value analysis (root cause of NVA), takt (causes of overproduction, WIP, idle time).</p>`,
 example:`<b>Jefferson Memorial.</b> It deteriorates faster → washed more → more bird droppings → more birds → more spiders → more insects at dusk → <b>the lights attract them</b>. The fix was turning the lights on 1 hour later, giving 90% fewer droppings.<br><br>
 <b>OR case.</b> Surgeries exceed takt of 67.5 min → tool prep delays → sterilization slow → backlog from limited equipment → sterilization team not told in advance → <b>root cause: poor communication and scheduling between the surgical and sterilization teams</b>. In PDCA: <b>Plan</b> a tool-scheduling and notification system, <b>Do</b> a pilot in one OR for a week, <b>Check</b> cycle time vs takt and on-time trays, <b>Act</b> by standardizing across all ORs.`,
 traps:['Five is an <b>average</b>, not a rule.','Countermeasures are developed in <b>Plan</b> (step 5); implementing is <b>Do</b>.','Check compares <b>planned vs actual</b>; Act <b>standardizes</b>.','A pilot in one OR = <b>Do</b>. Rolling out to all ORs = <b>Act</b>.']},

{id:'pull',n:9,icon:'🧲',title:'Push, pull, kanban & supermarkets',principle:'Step 4 · Establish pull',time:'14 min',
 summary:'Push vs pull, kanban signals, supermarket vs sequential pull, withdrawal vs production kanban, FIFO and heijunka.',
 intuition:'Push makes stuff because a forecast said so. Pull makes stuff because a customer just used one. Pull replaces only what was consumed.',
 analogy:'A grocery shelf is a supermarket pull. When you take milk, a stocker refills that spot. A custom sandwich shop is a sequential pull: made to order, first in first out.',
 formal:`<table><tr><th>Push</th><th>Pull (Lean ideal)</th></tr>
 <tr><td>Each operation independent; schedules from a <b>forecast</b></td><td>Each operation part of one process; work based on <b>consumption</b></td></tr>
 <tr><td>Complex, expensive scheduling systems; expediting needed</td><td>Simple planning; expediting rarely needed</td></tr>
 <tr><td>Large lots, high inventory, problems hidden, poor communication</td><td>Small lots, lower inventory, problems visible, good communication</td></tr>
 <tr><td>"Make all we can just in case"</td><td>"Make what we need when we need it" (JIT)</td></tr>
 <tr><td>ED patients sent to units before they're ready; stocking closets by prediction</td><td>As one patient leaves the OR, the next is ready</td></tr></table>
 <ul><li><b>Pull system</b> = customer-controlled, uses <b>signals</b> to authorize work; replaces what was consumed. <b>JIT</b>: what is needed, when needed, in the quantity needed.</li>
 <li><b>Kanban</b> = "signal" or "card". A visual cue for <b>when</b> to order, <b>from whom</b> and <b>what quantity</b>. Physical or electronic. Controls WIP; aligns WIP with demand.</li>
 <li><b>Withdrawal kanban</b> authorizes <b>movement</b> of parts. <b>Production kanban</b> authorizes <b>production</b> of parts.</li></ul>
 <table><tr><th></th><th>Supermarket pull</th><th>Sequential pull</th></tr>
 <tr><td>Also called</td><td>Fill-up, replenishment, <b>A-type</b></td><td>Make-to-order</td></tr>
 <tr><td>Demand</td><td><b>Unknown</b>: stock held on hand</td><td><b>Known</b>: made on a schedule</td></tr>
 <tr><td>How</td><td>Downstream takes from the store; a kanban goes upstream; upstream replaces what was taken</td><td>Scheduling sets quantity and mix; kanban cards go in a <b>heijunka box</b>; strict <b>FIFO</b></td></tr>
 <tr><td>Pros</td><td>Ready to ship on short notice</td><td>Less inventory and waste</td></tr>
 <tr><td>Cons</td><td>Needs space and inventory for every product</td><td>Needs high stability, short predictable lead times, strong management</td></tr></table>
 <p>A mixed supermarket + sequential system can be used selectively. In pull, products flow <b>FIFO</b> (oldest queued first); one-piece flow is the ideal.</p>`,
 example:`<b>Supply closet.</b> Two bins of IV start kits. When bin 1 empties, its card goes to the materials room, which is a withdrawal signal to move a bin. Materials then signals the supplier (production) to replace exactly one bin. Nothing is ordered "just in case".`,
 traps:['Supermarket = <b>unknown demand</b>, inventory on hand. Sequential = <b>known demand</b>, made to schedule.','Withdrawal = <b>move</b>; production = <b>make</b>.','Heijunka box goes with <b>sequential</b> pull.','Push schedules come from a <b>forecast</b>.']},

{id:'std',n:10,icon:'⚙️',title:'Standard work, SMED & TPM/OEE',principle:'Step 4 · Establish pull',time:'15 min',
 summary:'The one best way, quick changeover (internal vs external), and OEE = A × P × Q.',
 intuition:'Standardize the current best way so everyone does it the same, which makes problems and improvements measurable. Make changeovers fast, and keep machines ready and reliable.',
 analogy:'A Formula 1 pit stop. The crew has standard work (each person one job). Tires and fuel are staged before the car arrives (external setup), so the car stops for only about 2 seconds (internal setup).',
 formal:`<h3>Standard work</h3>
 <ul><li>The <b>current, one best way</b> to complete an activity <b>safely</b>, with the proper outcome and the highest quality. It is the best, safest and easiest way.</li>
 <li>A documented record that <b>all employees on all shifts</b> follow. The best combination of people and equipment, using the minimum labor, space, inventory and equipment for a given level of demand (takt).</li>
 <li>Reduces variation; focuses on the <b>employee process</b>, not equipment or materials. Document: who, tasks, cycle time, skills, process capability, a map of where the work is done.</li>
 <li><b>Job instruction sheet</b>: the steps of the job, used for training and reconfirming. <b>Standard work chart</b>: movement, material location and layout, including <b>takt, cycle time, work sequence and standard WIP</b>.</li>
 <li>"You cannot have improvement without standardization" (Tom Zidel).</li></ul>
 <h3>SMED / SUR / changeover</h3>
 <ul><li>Single-Minute Exchange of Dies, also called <b>quick changeover</b> or <b>setup reduction (SUR)</b>. Minimizes the time from finishing one product or service to getting ready for the next (clean-up, set-up, start-up).</li>
 <li>Toyota cut changeovers from hours to <b>9 minutes or less (single-digit minutes)</b>.</li>
 <li><b>Internal</b> = done while the machine is <b>shut down</b>. <b>External</b> = done while the equipment is <b>running</b>. <b>Objective: move internal to external, and improve both.</b></li>
 <li>Steps: measure a baseline → eliminate non-essential tasks and movement → classify internal/external → convert internal to external → simplify internal → stage supplies at <b>point of use</b> → streamline → measure again.</li></ul>
 <h3>TPM (Total Productive Maintenance)</h3>
 <div class="formula">OEE = Availability × Performance × Quality<br>Availability = operating time ÷ planned time<br>Performance = (ideal cycle time × total output) ÷ operating time<br>Quality = good output ÷ total output<br>World-class OEE ≈ 85%</div>
 <ul><li><b>Equipment management</b>: a team effort (operators, maintenance, engineers, supervisors).</li>
 <li><b>Preventive and predictive maintenance</b>: planned replacement of worn parts, using technology.</li>
 <li><b>Autonomous maintenance</b>: <b>operators</b> are responsible for upkeep and call specialists only for skills they lack.</li></ul>`,
 example:`<b>OR changeover case (40 min today).</b> Must be <b>internal</b> (OR empty): 1 remove instruments (5), 2 clean and disinfect (10), 4 biohazard disposal (3) = <b>18 min</b>. Can be <b>external</b>: 3 restock (5), 5 test anesthesia equipment (5), 6 verify patient documents (4), 7 pre-arrange instruments (5), 8 refill cleaning supplies (3) = 22 min. Changeover drops from <b>40 → 18 min</b>.<br><br>
 <b>OEE case (anesthesia machine).</b> Availability = 540/600 = 90%. Performance = (60 × 8)/480 = 100%. Quality = 7/8 = 87.5%. OEE = 0.90 × 1.00 × 0.875 = <b>78.75%</b>, below the 85% world-class level. <i>Note: the slide shows 540 min on the availability slide and 480 min on the performance slide. If your instructor uses 540 for performance, P = 88.9% and OEE = 70%. Check the class answer key.</i>`,
 traps:['<b>Internal = machine stopped</b>; <b>external = machine running</b>.','OEE <b>multiplies</b> the three factors; it does not average them.','<b>85%</b> = world-class OEE.','Autonomous maintenance = <b>operators</b> maintain their own equipment.','Standard work is "current" best. It will improve, so it isn\'t permanent.']},

{id:'perf',n:11,icon:'🏆',title:'Seek perfection: future VSM, poka yoke, kaizen, A3, change',principle:'Step 5 · Seek perfection',time:'18 min',
 summary:'Future/ideal state, mistake-proofing, the visual workplace and andon, kaizen vs kaikaku, A3, change management, and how the methods compare.',
 intuition:'Improvement never ends. Design the better future, mistake-proof it, make status visible, improve a little every day, and bring the people along.',
 analogy:'A USB-C plug fits only the right port (poka yoke). A traffic light is an andon. Brushing your teeth daily is kaizen. A full kitchen remodel in one month is kaikaku.',
 formal:`<h3>Future state VSM</h3><p>Review the current state, choose the best solutions, estimate impact, and <b>prioritize improvements through a pilot</b>. Questions to ask: customer requirements, where continuous flow is possible, the single point of scheduling, how to level load and mix (heijunka), make-to-order vs finished goods, and the management timeframe. Moves: eliminate NVA, reduce steps, hand-offs, approvals and batching, co-locate by flow, standard work, an organized workplace.</p>
 <h3>Poka yoke (error/mistake proofing)</h3><ul><li><b>Poka</b> = an inadvertent mistake anyone can make. <b>Yoke</b> = to prevent or proof.</li>
 <li>Focus on the <b>error, not the employee</b>. Errors come mostly from the <b>system</b>.</li>
 <li>3 tenets: make it <b>difficult to make</b> a mistake, <b>easy to identify</b> one, and <b>easy to fix</b> it.</li>
 <li>Approaches: <b>forced control</b> devices, and <b>warning and sensory alerts</b>. Use with root-cause tools like the 5 Whys.</li>
 <li>Examples: different fuel nozzle sizes (diesel vs unleaded), different-size connectors.</li></ul>
 <h3>Visual workplace</h3><p>Anyone can walk in and understand the current situation (<b>self-explaining</b>), the work process (<b>self-ordering</b>), whether they are ahead or behind schedule (<b>self-regulating</b>), and when there is an abnormality (<b>self-improving</b>). <b>Andon</b> = a visual status light: normal / warning / stopped.</p>
 <h3>Kaizen</h3><ul><li><b>Kai</b> = change, <b>Zen</b> = good, for the better. <b>Small, incremental</b> improvement; a philosophy of continuous improvement that empowers front-line staff and uses group consensus.</li>
 <li><b>Kaikaku</b> = <b>radical</b> improvement in a limited time (1 week to 3 months).</li>
 <li><b>Kaizen event</b> (kaizen workshop, rapid continuous improvement, kaizen blitz): typically <b>one week</b>. Phase 1 prepare (scope, objectives, preliminary current-state map, documents). Phase 2 conduct. Phase 3 after (review action items and metrics, more opportunities).</li></ul>
 <h3>A3</h3><p>A structured problem-solving and reporting tool on <b>one side of 11×17 paper</b> (A3 size), following <b>PDCA</b>. Used for root-cause problem solving, communication, tracking CI and finding improvement areas. Case flow: problem statement → current state → root cause → target state → countermeasures → implementation plan → metrics → follow-up → document and share.</p>
 <h3>Change management</h3><ul><li>Even the best solutions fail without adoption. Key concepts: <b>awareness &amp; alignment</b> (the "why"), <b>leadership &amp; sponsorship</b>, <b>stakeholder engagement</b>, <b>communication</b> (two-way), <b>training &amp; support</b>, <b>resistance management</b>, <b>sustainment</b>.</li>
 <li>Requirements for change: vision/mission/purpose, leadership, people (<b>WIIFM</b> = what's in it for me, plus skills), processes &amp; resources, plan &amp; program.</li>
 <li>Lean management: managers <b>coach and empower</b>, with two-way communication and shared responsibility.</li>
 <li>Roles: the senior team designs value in and creates flow. Middle management takes waste out and improves flow. The workforce keeps waste out and sustains flow (solve, standardize, improve).</li></ul>
 <h3>Problem-solving approaches compared</h3>
 <table><tr><th>PDCA</th><th>DMAIC</th><th>A3</th><th>8D</th></tr>
 <tr><td>Plan</td><td>Define, Measure, Analyze</td><td>Clarify → break down → target → root cause → countermeasures</td><td>1 Team · 2 Describe · 3 Containment · 4 Root cause · 5 Corrective actions</td></tr>
 <tr><td>Do</td><td>Improve</td><td>Implement countermeasures</td><td>6 Implement</td></tr>
 <tr><td>Check</td><td>Control</td><td>Evaluate results</td><td>7 Prevent recurrence</td></tr>
 <tr><td>Act</td><td>Control</td><td>Standardize success</td><td>8 Congratulate team</td></tr></table>
 <p><b>Lean vs Six Sigma</b>. Similarities: customer focus, shared diagnostic tools for defects and root causes, statistics. Difference: Six Sigma uses <b>control charts extensively</b>.</p>`,
 example:`<b>OR A3.</b> Problem: surgeries exceed the 67.5 min takt. Current state: VSM shows 27 min of waiting. Root cause: no advance tool requests to sterile processing. Target: cycle time ≤ takt and 98% on-time trays. Countermeasure: a tool-scheduling notification plus pre-staged case carts (SMED external). Plan: pilot OR 3 for one week. Metrics: cycle time, on-time trays, turnover. Follow-up: standardize and audit monthly.`,
 traps:['Kaizen = <b>small, incremental</b>; kaikaku = <b>radical, short timeframe</b>.','A3 follows <b>PDCA</b>; it is one page on 11×17 paper.','Poka yoke blames the <b>system</b>, never the person.','Kaizen event ≈ <b>one week</b>.','Control charts = the <b>Six Sigma</b> differentiator.']}

function miniQuiz(id){

function qCard(box,q,label,next,opts={}){

function vFlash(){

function flashRun(){
 let deck=[],cur=null;const sel=$('#ftopic');
 function build(){const t=sel.value;deck=FLASH.map((f,i)=>i).filter(i=>t==='all'||FLASH[i][2]===t);pick()}
 function pick(){const boxes=deck.map(i=>S.flash[i]||0);const min=Math.min(...boxes);const cand=deck.filter(i=>(S.flash[i]||0)<=min+(Math.random()<.25?1:0));cur=cand[Math.floor(Math.random()*cand.length)];
  $('#fc').classList.remove('flip');setTimeout(()=>{$('#ff').innerHTML=esc(FLASH[cur][0])+`<div class="hint">tap to flip</div>`;$('#fb').innerHTML=esc(FLASH[cur][1])+`<div class="hint">${TOPICS[FLASH[cur][2]]}</div>`},150);
  const mastered=deck.filter(i=>(S.flash[i]||0)>=3).length;$('#fstat').textContent=`Mastered ${mastered}/${deck.length}`}
 sel.onchange=build;$('#fc').onclick=()=>$('#fc').classList.toggle('flip');
 $('#fg').onclick=()=>{S.flash[cur]=Math.min(3,(S.flash[cur]||0)+1);save();addXP(2);pick()};
 $('#fa').onclick=()=>{S.flash[cur]=0;save();pick()};
 const kh=e=>{if(e.target.tagName==='SELECT')return;if(e.key===' '){e.preventDefault();$('#fc').classList.toggle('flip')}else if(e.key==='ArrowRight')$('#fg').click();else if(e.key==='ArrowLeft')$('#fa').click()};
 document.addEventListener('keydown',kh);cleanup=()=>document.removeEventListener('keydown',kh);build();
}

function practiceRun(topic){
 const sel=$('#ptopic');sel.value=topic;let st=0,c=0,n=0,pool=[],k=0;
 function build(){const t=sel.value;let p;
  if(t==='weak'){const ws=Object.entries(S.topic).filter(([k,v])=>v.n>=2).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).slice(0,3).map(x=>x[0]);p=Q.filter(q=>ws.length?ws.includes(q[0]):true)}
  else p=Q.filter(q=>t==='all'||q[0]===t);pool=shuffle(p);k=0;next()}
 function next(){if(k>=pool.length){pool=shuffle(pool);k=0}
  qCard($('#pq'),pool[k],`Q${n+1}`,ok=>{n++;if(ok){c++;st++;if(st%5===0){addXP(15,`🔥 ${st} in a row!`);if(st%10===0)confetti()}}else st=0;
   $('#pstreak').textContent='Streak '+st;$('#pscore').textContent=`${c}/${n} (${Math.round(c/n*100)}%)`;k++;next()})}
 sel.onchange=build;build();
}

function vGames(){
 const G=[['waste','🗑️','Waste Hunter','Name the waste in each real-world scenario before time runs out. Combos multiply your points.'],['order','🔢','Order It','Click the steps in the right order: 5S, PDCA, Lean principles, 5 Whys, history and more.'],['memory','🧠','Japanese Match','A memory game pairing Lean\'s Japanese and German terms with their meanings.'],['calc','🧮','Calc Lab','Random takt, OEE, lead time, %VA and inventory-days problems with step-by-step solutions.'],['smed','🔧','SMED Sorter','Internal or external setup? Sort the changeover tasks.'],['map','🧭','Tool → Principle','Which of the 5 Lean principles does each tool belong to?']];
 return `<h1>🎮 Games</h1><p class="sub">Learning with fun. Each game trains a skill the exam tests.</p><div class="grid g3">${G.map(g=>`<div class="card mod" onclick="location.hash='games-${g[0]}'"><div style="font-size:34px">${g[1]}</div><h3>${g[2]}</h3><div style="color:var(--muted);font-size:14px">${g[3]}</div>${S.best[g[0]]!=null?`<div style="margin-top:10px"><span class="pill gold">Best: ${S.best[g[0]]}</span></div>`:''}</div>`).join('')}</div>`;
}
function best(g,v){if(S.best[g]==null||v>S.best[g]){S.best[g]=v;save();return true}return false}

function gWaste(){
 setTimeout(()=>{
  let pool=shuffle(WASTE_SCEN),k=0,score=0,combo=0,lives=3,t0,iv;const box=$('#gw');
  function next(){if(k>=pool.length||lives<=0)return end();const [s,a]=pool[k];let left=12;
   box.innerHTML=`<div class="qtop"><span>❤️ ${'♥'.repeat(lives)}</span><span class="combo">${combo>1?'x'+combo+' COMBO':''}</span><span class="lbl">Score ${score}</span><span class="timer" id="wt">12</span></div><div class="bigq">${esc(s)}</div><div class="grid g4">${shuffle(WASTES).map(w=>`<button class="tile" data-w="${w}">${w}</button>`).join('')}</div>`;
   box.querySelectorAll('.tile').forEach(b=>b.onclick=()=>answer(b.dataset.w,b));
   iv=setInterval(()=>{left--;const e=$('#wt');if(e)e.textContent=left;if(left<=0){clearInterval(iv);answer(null)}},1000);cleanup=()=>clearInterval(iv);
   function answer(w,b){clearInterval(iv);const ok=w===a;box.querySelectorAll('.tile').forEach(x=>{x.disabled=true;if(x.dataset.w===a)x.classList.add('sel')});
    if(ok){combo++;const pts=10*Math.min(combo,5)+left;score+=pts;rec('waste',true);toast(`+${pts}`)}else{combo=0;lives--;rec('waste',false);if(b)b.classList.add('wrong')}
    setTimeout(()=>{k++;next()},ok?600:1400)}}
  function end(){const nb=best('waste',score);addXP(Math.round(score/5),'Waste Hunter');if(nb&&score>0)confetti();
   box.innerHTML=`<div style="text-align:center;padding:20px"><div class="stat">${score} pts</div><p>${nb?'🏆 New best!':'Best: '+S.best.waste}</p><p style="color:var(--muted)">Remember: <b>Motion = people</b>, <b>Transportation = things</b>, <b>Overproduction = the greatest waste</b>.</p><button class="btn" onclick="render()">Play again</button></div>`}
  next();
 },0);
 return `<a class="back" href="#games">← Games</a><h1>🗑️ Waste Hunter</h1><p class="sub">12 seconds per scenario. 3 lives. Consecutive correct answers build a combo (up to ×5).</p><div class="card" id="gw"></div>`;
}

function gOrder(){
 setTimeout(()=>{
  const box=$('#go');let set=0,mist=0,t0=Date.now();
  function run(i){set=i;const S0=ORDER_SETS[i];let step=0;mist=0;t0=Date.now();
   box.innerHTML=`<div class="row" style="margin-bottom:12px"><select id="oset">${ORDER_SETS.map((o,j)=>`<option value="${j}" ${j===i?'selected':''}>${o.name}</option>`).join('')}</select><span class="pill red" id="omis">Mistakes 0</span></div>
   <div class="bigq" style="min-height:0" id="oprog">Click item #1</div><div class="grid g3" id="otiles">${shuffle(S0.items.map((t,j)=>j)).map(j=>`<button class="tile" data-j="${j}">${esc(S0.items[j])}</button>`).join('')}</div>`;
   $('#oset').onchange=e=>run(+e.target.value);
   box.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(b.classList.contains('gone'))return;
    if(+b.dataset.j===step){b.classList.add('gone');b.innerHTML=`<span><b>${step+1}.</b> ${esc(S0.items[step])}</span>`;step++;
     if(step===S0.items.length){const sec=Math.round((Date.now()-t0)/1000);addXP(mist===0?25:10,mist===0?'Perfect order!':'Done');if(mist===0)confetti();
      $('#oprog').innerHTML=`✅ ${S0.name} done in ${sec}s with ${mist} mistake(s). <button class="btn sm" style="margin-left:10px" id="onext">Next set →</button>`;$('#onext').onclick=()=>run((i+1)%ORDER_SETS.length)}
     else $('#oprog').textContent=`Click item #${step+1}`}
    else{mist++;$('#omis').textContent='Mistakes '+mist;b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong')}})}
  run(0)},0);
 return `<a class="back" href="#games">← Games</a><h1>🔢 Order It</h1><p class="sub">Sequences the exam loves to test. Aim for zero mistakes.</p><div class="card" id="go"></div>`;
}

function gMemory(){
 setTimeout(()=>{
  const box=$('#gm');const pairs=shuffle(MATCH).slice(0,8);let cards=shuffle(pairs.flatMap((p,i)=>[{t:p[0],i},{t:p[1],i}]));let open=[],matched=0,moves=0,lock=false;
  box.innerHTML=`<div class="row" style="margin-bottom:12px"><span class="pill" id="mm">Moves 0</span><button class="btn sm ghost" onclick="render()">New board</button></div><div class="grid g4" id="mg">${cards.map((c,k)=>`<button class="tile mem hidden" data-k="${k}">${esc(c.t)}</button>`).join('')}</div>`;
  box.querySelectorAll('.mem').forEach(b=>b.onclick=()=>{if(lock||!b.classList.contains('hidden'))return;b.classList.remove('hidden');open.push(b);
   if(open.length===2){moves++;$('#mm').textContent='Moves '+moves;const [a,c]=open;
    if(cards[a.dataset.k].i===cards[c.dataset.k].i){a.classList.add('matched');c.classList.add('matched');open=[];matched++;
     if(matched===8){const sc=Math.max(0,40-moves);best('memory',sc);addXP(30,`Matched in ${moves} moves`);confetti()}}
    else{lock=true;setTimeout(()=>{a.classList.add('hidden');c.classList.add('hidden');open=[];lock=false},800)}}})},0);
 return `<a class="back" href="#games">← Games</a><h1>🧠 Japanese Match</h1><p class="sub">Flip two cards and match each term to its meaning. Fewer moves gives a higher score.</p><div class="card" id="gm"></div>`;
}

function gCalc(){
 setTimeout(()=>{
  const box=$('#gc');let streakC=0;
  const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
  const gens=[
   ()=>{const h=r(7,10),br=r(3,6)*10,d=r(4,12)*5;const av=h*60-br;const ans=+(av/d).toFixed(2);return{q:`A shift is ${h} hours with ${br} minutes of breaks/meetings. Demand is ${d} units per shift. What is the takt time in <b>minutes</b> per unit?`,ans,unit:'min',sol:`Available = ${h}×60 − ${br} = ${av} min. Takt = ${av} ÷ ${d} = <b>${ans} min</b>.`}},
   ()=>{const av=r(400,460),d=r(40,90);const ans=Math.round(av*60/d);return{q:`Available time is ${av} minutes per shift and demand is ${d} pieces. What is takt in <b>seconds</b>?`,ans,unit:'s',tol:1,sol:`${av} × 60 = ${av*60} s. ${av*60} ÷ ${d} = <b>${ans} s</b>.`}},
   ()=>{const a=r(80,98),p=r(80,99),q=r(90,100);const ans=+(a*p*q/10000).toFixed(1);return{q:`Availability = ${a}%, Performance = ${p}%, Quality = ${q}%. What is OEE (%)? Is it world-class?`,ans,unit:'%',tol:.2,sol:`OEE = ${a/100} × ${p/100} × ${q/100} = <b>${ans}%</b>. ${ans>=85?'≥ 85%, so world-class.':'Below the 85% world-class level.'}`}},
   ()=>{const pt=r(8,11)*60,dn=r(3,8)*10,ic=r(5,15),out=Math.floor((pt-dn)/ic*r(80,95)/100),good=out-r(0,4);const A=(pt-dn)/pt,P=ic*out/(pt-dn),Qq=good/out;const ans=+(A*P*Qq*100).toFixed(1);
     return{q:`Planned time ${pt} min, downtime ${dn} min, ideal cycle time ${ic} min/unit, total output ${out}, good output ${good}. What is OEE (%)?`,ans,unit:'%',tol:.3,sol:`A = ${pt-dn}/${pt} = ${(A*100).toFixed(1)}%. P = (${ic}×${out})/${pt-dn} = ${(P*100).toFixed(1)}%. Q = ${good}/${out} = ${(Qq*100).toFixed(1)}%. OEE = <b>${ans}%</b>.`}},
   ()=>{const w=[r(2,15),r(5,20),r(5,20)],c=[r(2,6),r(4,10),r(10,25)];const lt=w.reduce((a,b)=>a+b)+c.reduce((a,b)=>a+b);const va=c[1]+c[2];const ans=Math.round(va/lt*100);
     return{q:`A clinic visit: check-in ${c[0]} min (necessary NVA), wait ${w[0]}, nurse exam ${c[1]} (VA), wait ${w[1]}, physician ${c[2]} (VA), wait ${w[2]}. What is % value-added time (nearest %)?`,ans,unit:'%',tol:1,sol:`Lead time = ${[...c,...w].join(' + ')} = ${lt} min. VA = ${c[1]} + ${c[2]} = ${va}. %VA = ${va}/${lt} = <b>${ans}%</b>.`}},
   ()=>{const inv=r(30,90)*100,m=r(10,30)*1000,dd=20;const daily=m/dd;const ans=+(inv/daily).toFixed(1);return{q:`Inventory is ${inv.toLocaleString()} pcs. Monthly demand is ${m.toLocaleString()} pcs over ${dd} working days. How many <b>days of inventory</b>?`,ans,unit:'days',tol:.1,sol:`Daily demand = ${m} ÷ ${dd} = ${daily}. Days = ${inv} ÷ ${daily} = <b>${ans} days</b>.`}},
   ()=>{const h=r(8,12),br=r(4,8)*10,ors=r(3,8),s=r(20,50);const av=(h*60-br)*ors;const ans=+(av/s).toFixed(1);return{q:`ORs run ${h} h/day with ${br} min of breaks/cleaning each. There are ${ors} ORs and ${s} surgeries needed per day. Takt time (min)?`,ans,unit:'min',tol:.1,sol:`(${h}×60 − ${br}) × ${ors} = ${av} min. ${av} ÷ ${s} = <b>${ans} min</b>.`}},
   ()=>{const t=[r(3,10),r(5,12),r(4,10),r(2,8),r(3,9)];const ext=[0,1,0,1,1];const ans=t.filter((x,i)=>!ext[i]).reduce((a,b)=>a+b,0);const names=['Remove used tools (machine must be off)','Stage next tools at point of use','Swap fixture (machine off)','Print next job paperwork','Pre-heat new die'];
     return{q:`A changeover has: ${names.map((n,i)=>`${n} ${t[i]} min`).join('; ')}. After converting every possible task to external, how many minutes of internal setup remain?`,ans,unit:'min',sol:`Internal (needs machine off): ${t[0]} + ${t[2]} = <b>${ans} min</b>. The rest run while the machine operates (external).`}}
  ];
  function next(){const g=gens[Math.floor(Math.random()*gens.length)]();
   box.innerHTML=`<div class="qtop"><span class="pill gold">Streak ${streakC}</span><span class="lbl">Answer within ±${g.tol||.05} ${g.unit}</span></div><div class="bigq" style="font-weight:600;font-size:16.5px">${g.q}</div>
   <form id="cf" class="row"><input class="num" id="ci" inputmode="decimal" placeholder="answer" autocomplete="off"><span>${g.unit}</span><button class="btn">Check</button><button type="button" class="btn ghost" id="cs">Show solution</button></form><div id="cerr"></div><div id="cres"></div>`;
   $('#ci').focus();$('#ci').oninput=()=>$('#cerr').innerHTML='';
   const show=(ok,v)=>{$('#cres').innerHTML=`<div class="expl"><b>${ok?'✅ Correct!':ok===false?'❌ Not quite.':'📘 Solution'}</b> ${g.sol}</div><button class="btn" style="margin-top:10px" id="cn">Next problem →</button>`;$('#cn').onclick=next;$('#cf').querySelectorAll('button,input').forEach(x=>x.disabled=true)};
   $('#cf').onsubmit=e=>{e.preventDefault();const raw=$('#ci').value.trim().replace(/[%,]/g,'');if(raw===''||isNaN(+raw)){$('#cerr').innerHTML='<div class="err">Enter a number first.</div>';return}
    const v=+raw,ok=Math.abs(v-g.ans)<=(g.tol||.05)+1e-9;rec('flow',ok);if(ok){streakC++;addXP(12,'Calc correct');best('calc',streakC);if(streakC%5===0)confetti()}else streakC=0;show(ok,v)};
   $('#cs').onclick=()=>{streakC=0;show(null)}}
  next()},0);
 return `<a class="back" href="#games">← Games</a><h1>🧮 Calc Lab</h1><p class="sub">Endless randomized problems on takt time, OEE, % value-added, days of inventory and SMED. Get 5 in a row to be exam-ready on math.</p><div class="card" id="gc"></div>`;
}

function gSmed(){
 setTimeout(()=>{
  const box=$('#gs');const tasks=shuffle(SMED_TASKS);let k=0,c=0;const placed={I:[],E:[]};
  function draw(){box.innerHTML=`${k<tasks.length?`<div class="bigq">${esc(tasks[k][0])}</div><div class="row"><button class="btn" id="bI">⛔ Internal (machine stopped)</button><button class="btn gold" id="bE">▶️ External (machine running)</button></div>`:`<div class="bigq">Done: ${c}/${tasks.length} correct. <button class="btn sm" style="margin-left:10px" onclick="render()">Again</button></div>`}
   <div class="sortbins"><div class="bin"><h4>Internal</h4>${placed.I.map(x=>`<span class="chip ${x[1]?'ok':'bad'}">${esc(x[0])}</span>`).join('')}</div><div class="bin"><h4>External</h4>${placed.E.map(x=>`<span class="chip ${x[1]?'ok':'bad'}">${esc(x[0])}</span>`).join('')}</div></div>`;
   if(k<tasks.length){$('#bI').onclick=()=>go('I');$('#bE').onclick=()=>go('E')}
   else{best('smed',c);addXP(c*3,'SMED sorted');if(c===tasks.length)confetti()}}
  function go(b){const ok=tasks[k][1]===b;if(ok)c++;rec('std',ok);placed[b].push([tasks[k][0],ok]);if(!ok)toast('That one is '+(tasks[k][1]==='I'?'internal':'external'));k++;draw()}
  draw()},0);
 return `<a class="back" href="#games">← Games</a><h1>🔧 SMED Sorter</h1><p class="sub">Internal = it can only happen while the equipment or room is stopped. External = it can be done while it runs. Red chips are wrong.</p><div class="card" id="gs"></div>`;
}

function gMap(){
 setTimeout(()=>{
  const box=$('#gp');const tools=shuffle(TOOL_MAP);let k=0,c=0;
  function draw(){if(k>=tools.length){best('map',c);addXP(c*2,'Mapping done');if(c>=tools.length-1)confetti();box.innerHTML=`<div style="text-align:center"><div class="stat">${c}/${tools.length}</div><p>Visual management appears in both Step 2 and Step 5 of the course map.</p><button class="btn" onclick="render()">Again</button></div>`;return}
   box.innerHTML=`<div class="qtop"><span class="lbl">${k+1}/${tools.length}</span><span class="pill">${c} correct</span></div><div class="bigq" style="justify-content:center;font-size:22px">${esc(tools[k][0])}</div><div class="grid g3">${PRINC.map((p,i)=>`<button class="tile" data-i="${i}">${i+1}. ${p}</button>`).join('')}</div>`;
   box.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===tools[k][1];if(ok)c++;else toast('→ '+PRINC[tools[k][1]]);b.classList.add(ok?'sel':'wrong');setTimeout(()=>{k++;draw()},ok?350:900)})}
  draw()},0);
 return `<a class="back" href="#games">← Games</a><h1>🧭 Tool → Principle</h1><p class="sub">The course groups every tool under one of the 5 Lean principles. Exams test this mapping.</p><div class="card" id="gp"></div>`;
}

function vCheat(){
 const C=[
 ['Exam','<ul><li>40 Q · 2 h · 70% (28/40) · open notes · no internet</li></ul>'],
 ['5 Lean principles → tools','<ul><li><b>1 Identify value</b>: VOC, stakeholder analysis</li><li><b>2 Map value stream</b>: wastes, 5S, visual mgmt, flowchart, SIPOC, swim lane, spaghetti, VSM (current), value analysis</li><li><b>3 Create flow</b>: takt, flow, RCA, 5 Whys, PDCA</li><li><b>4 Establish pull</b>: push/pull, kanban, supermarket, standard work, SMED, TPM</li><li><b>5 Seek perfection</b>: future VSM, poka yoke, visual mgmt, kaizen, A3, change mgmt</li></ul>'],
 ['Formulas','<div class="formula">Takt = available time ÷ demand<br>Prod. rate = demand ÷ time (1/takt)<br>Lead time = Σ waits + Σ cycle times<br>%VA = VA time ÷ lead time<br>Days inv = inventory ÷ daily demand<br>OEE = A × P × Q (85% = world class)<br>A = operating ÷ planned<br>P = ideal CT × output ÷ operating<br>Q = good ÷ total</div>'],
 ['Worked numbers from slides','<ul><li>435 min × 60 ÷ 55 = <b>474 s</b></li><li>40 h ÷ 100 = <b>24 min</b>; 2.5 units/h</li><li>Clinic LT <b>75</b>, VA 25 → <b>33%</b>, system CT 20</li><li>OR takt = 540 × 5 ÷ 40 = <b>67.5 min</b></li><li>7,000 ÷ 920 = <b>7.6 days</b></li><li>OR VSM LT = 27 + 145 = <b>172 min</b></li><li>OR SMED 40 → <b>18 min</b> internal</li><li>OEE case: A 90%, Q 87.5%</li></ul>'],
 ['8 wastes: DOWNTIME','<ul><li>Defect · Overproduction (<b>greatest</b>) · Waiting · Neglected talent (added later) · Transportation (things) · Inventory · Motion (people) · Excess processing</li><li>Also TIM WOOD / TIM U WOOD / TRIM WOOD</li></ul>'],
 ['Value','<ul><li>VA: pays + transforms + right first time</li><li>Unnecessary NVA → eliminate</li><li>Necessary NVA (law/safety) → minimize</li><li>&gt;50% of a process is waste</li><li>VOC: needs, preferences, pain points</li></ul>'],
 ['Stakeholders','<ul><li>Hi P/Hi I: manage closely · Hi P/Lo I: keep satisfied · Lo P/Hi I: keep informed · Lo/Lo: monitor</li><li>Primary (direct) · Secondary (suppliers, regulators) · Key (influence)</li><li>Inform · Consult · Collaborate · Monitor</li></ul>'],
 ['5S','<ul><li>Sort/Seiri (red tag) → Set in order/Seiton (30 s you, 60 s anyone) → Shine/Seiso → Standardize/Seiketsu (owner, checklists) → Sustain/Shitsuke (audits, gemba)</li><li>Hourly: arm · shift: short walk · daily: further · monthly: dept · annual: off-site</li></ul>'],
 ['Maps','<ul><li>30,000 ft: VSM, SIPOC · 10,000 ft: swim lane · ground: flowchart</li><li>Swim lane = cross-functional, <b>hand-offs</b></li><li>Spaghetti = <b>motion + transport</b></li><li>VSM = materials + information, whole process</li><li>Flowchart = most common</li></ul>'],
 ['PDCA','<ul><li><b>P</b>: 1 clarify · 2 break down · 3 target · 4 root cause · 5 countermeasures</li><li><b>D</b>: 6 implement (pilot)</li><li><b>C</b>: 7 evaluate (→ back to 5)</li><li><b>A</b>: 8 standardize, share</li><li>P = DMA, D = I, C/A = C (DMAIC)</li></ul>'],
 ['Pull','<ul><li>Push = forecast; pull = consumption (JIT)</li><li>Withdrawal kanban = move; production kanban = make</li><li>Supermarket (A-type, fill-up) = unknown demand, stock on hand</li><li>Sequential = known demand, heijunka box, FIFO, needs stability</li></ul>'],
 ['Std work · SMED · TPM','<ul><li>Std work = current one best way, safe, all shifts, employee-focused</li><li>Chart: takt, CT, sequence, std WIP</li><li>SMED: internal = stopped, external = running → convert I→E; Toyota &lt;10 min</li><li>TPM: equipment mgmt, preventive/predictive, autonomous (operators)</li></ul>'],
 ['Perfection','<ul><li>Poka (mistake) yoke (prevent): hard to make, easy to see, easy to fix; forced control or warnings; blame the system</li><li>Kaizen = small incremental; kaikaku = radical (1 wk–3 mo); event ≈ 1 week, 3 phases</li><li>A3 = one 11×17 page, PDCA</li><li>Andon: normal/warning/stopped</li><li>Visual workplace: self-explaining, -ordering, -regulating, -improving</li><li>Change: awareness, sponsorship, engagement, comms, training, resistance, sustain; WIIFM</li></ul>'],
 ['People & history','<ul><li>Whitney 1799 · Taylor 1911 · Gilbreths ~1915 (healthcare) · Ford 1922 · Deming PDSA/SQC · Ohno & Shingo TPS · Krafcik "Lean" 1988</li><li>Graban: no Lean without PDCA · Zidel: no improvement without standardization</li><li>Shingo: cultural enablers, CI, enterprise alignment, results</li><li>Six Sigma&rsquo;s differentiator: control charts</li></ul>']

 return `<h1>📋 Cheat sheet</h1><p class="sub">The exam is open notes. Keep this open on a second screen, or copy it into your notes.</p><div class="row" style="margin-bottom:14px"><button class="btn ghost sm" id="copyC">📋 Copy as text</button></div><div class="grid g2 cheat" id="cheatBody">${C.map(c=>`<div class="card"><h3>${c[0]}</h3>${c[1]}</div>`).join('')}</div>`;
}

/* ================= ROUTER ================= */
function render(){
 if(cleanup){cleanup();cleanup=null}
 const h=location.hash.slice(1)||'home';const [r,sub]=[h.split('-')[0],h.split('-').slice(1).join('-')];let html;
 if(r==='learn')html=sub?vModule(sub):vLearn();
 else if(r==='flash')html=vFlash();
 else if(r==='practice')html=vPractice(sub);
 else if(r==='exam')html=sub==='result'?vExamResult():vExam();
 else if(r==='games')html=({waste:gWaste,order:gOrder,memory:gMemory,calc:gCalc,smed:gSmed,map:gMap}[sub]||vGames)();
 else if(r==='cheat')html=vCheat();
 else html=vHome();
 $('#main').innerHTML=html;renderNav();
 if(r==='exam'&&!sub&&!(EX&&!EX.done)){$('#startEx').onclick=()=>startExam(40,120);$('#startQuick').onclick=()=>startExam(20,60)}
 if(r==='exam'&&EX&&!EX.done){const sb=$('#subBtn');if(sb)sb.onclick=trySubmit;$('#subAny').onclick=trySubmit}
 if(r==='cheat'){$('#copyC').onclick=async()=>{try{await navigator.clipboard.writeText($('#cheatBody').innerText);toast('Copied to clipboard')}catch(e){toast('Copy blocked: select the text and copy manually')}}}
}
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);render()});
render();
</script>
